<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migration map</title>
<style>
/* Tokens: the reference data-viz palette, light and dark. Colors do three
   jobs only: ink, the side a mark belongs to (two categorical hues, source
   and target), and how alike a pair is (one blue ramp, light for 0.40 and
   dark for 1.00 in the light theme; the map reads it continuously and the
   histogram in three levels). */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --hairline: rgba(11, 11, 11, 0.10);
  --lvl-0: #86b6ef;
  --lvl-1: #3987e5;
  --lvl-2: #184f95;
  --side-0: #eb6834;
  --side-1: #1baf7a;
  --dep: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --hairline: rgba(255, 255, 255, 0.10);
    --lvl-0: #184f95;
    --lvl-1: #3987e5;
    --lvl-2: #9ec5f4;
    --side-0: #d95926;
    --side-1: #199e70;
    --dep: #898781;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink-1: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --hairline: rgba(255, 255, 255, 0.10);
  --lvl-0: #184f95;
  --lvl-1: #3987e5;
  --lvl-2: #9ec5f4;
  --side-0: #d95926;
  --side-1: #199e70;
  --dep: #898781;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); }
.viz-root {
  min-height: 100vh;
  background: var(--page);
  color: var(--ink-1);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.frame { max-width: 1320px; margin: 0 auto; padding: 32px 24px 56px; }
h1, h2, h3 { margin: 0; font-weight: 600; }
h2 { font-size: 21px; line-height: 1.25; }
h3 { font-size: 16px; }
p { margin: 0; }
code, .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink-1); outline-offset: 2px; }
.side0 { --side: var(--side-0); }
.side1 { --side: var(--side-1); }
.side-dot { fill: var(--side); }
.side-key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--side); margin-right: 6px; vertical-align: 0; }

/* The two shores: the header mirrors the map, source left, target right. */
.shores {
  display: grid;
  grid-template-columns: 1fr 14% 1fr;
  align-items: end;
  gap: 16px;
}
.shore-role { color: var(--ink-2); font-size: 14px; }
.shore-name { font-size: 28px; line-height: 1.2; overflow-wrap: anywhere; }
.shore.target { text-align: right; }
.figure-line { margin-top: 12px; display: flex; align-items: baseline; gap: 12px; }
.shore.target .figure-line { justify-content: flex-end; }
.hero { font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.01em; }
.figure { font-size: 32px; line-height: 1; font-weight: 600; }
.figure-note { color: var(--ink-2); max-width: 32ch; }
.tests-line { margin-top: 6px; color: var(--ink-2); font-size: 14px; }
.strait { align-self: end; text-align: center; color: var(--ink-2); font-size: 14px; padding-bottom: 4px; }
.strait strong { display: block; color: var(--ink-1); font-size: 32px; line-height: 1; font-weight: 600; }

/* The view tabs over one filter row: both scope everything below them,
   and they stay in sight while the page scrolls, since both views run
   long. */
.toolbar-sentinel { height: 1px; margin-top: 27px; }
.toolbar {
  position: sticky;
  top: 0;
  z-index: 3;
  margin-bottom: 16px;
  background: var(--page);
}
.toolbar.stuck { box-shadow: 0 1px 0 var(--grid); }
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--grid); }
.tabs button {
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  background: transparent;
  color: var(--ink-2);
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  padding: 8px 0;
  cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--ink-1); border-bottom-color: var(--ink-1); }
.filters {
  padding: 12px 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 20px;
}
.control { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.segmented { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; padding: 2px; background: var(--surface); }
.segmented button {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font: inherit;
  font-size: 14px;
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
}
.segmented button[aria-pressed="true"] { background: var(--ink-1); color: var(--surface); }
.segmented button:disabled { opacity: 0.4; cursor: default; }
.search {
  font: inherit;
  font-size: 14px;
  padding: 5px 10px;
  border: 1px solid var(--axis);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink-1);
  min-width: 240px;
}
.plain-button {
  font: inherit;
  font-size: 14px;
  border: 1px solid var(--axis);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink-1);
  padding: 4px 12px;
  cursor: pointer;
}

/* The map. */
.map-block { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.map-figure {
  margin: 0;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  overflow: hidden;
}
/* A vertical swipe scrolls the page and a pinch zooms it; a sideways drag
   moves the map. */
#map { display: block; width: 100%; cursor: grab; touch-action: pan-y pinch-zoom; }
.zoom { display: inline-flex; gap: 6px; }
.zoom .plain-button { min-width: 34px; }
#map.panning { cursor: grabbing; }
.channel { fill: var(--page); }
.dep { stroke: var(--dep); stroke-width: 1; opacity: 0.35; fill: none; }
/* A bridge is a line of dots, colored by the similarity of its pairs. */
.bridge { fill: none; stroke-linecap: round; opacity: 0.9; }
/* A circle is code, a square is tests; the color is the side, the fill
   rises with the share of functions that have a counterpart. */
.shape { fill: var(--surface); stroke: var(--side); stroke-width: 2; }
.shape.edge { fill: none; }
.level { fill: var(--side); }
.ready-ring { fill: none; stroke: var(--ink-1); stroke-width: 1.5; }
.hit { fill: transparent; cursor: pointer; }
/* A halo of the surface keeps a label readable over the dots it crosses. */
.label { fill: var(--ink-2); font-size: 12px; pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.label.source { text-anchor: end; }
.label.strong { fill: var(--ink-1); font-weight: 600; }
.lane-title { fill: var(--ink-3); font-size: 12px; }
svg.focusing .dep, svg.focusing .bridge, svg.focusing .node, svg.focusing .label { opacity: 0.1; }
svg.focusing .on { opacity: 1; }
svg.focusing .dep.on { opacity: 0.9; stroke: var(--ink-2); }
svg.focusing .bridge.on { opacity: 0.95; }
.node.selected .shape { stroke-width: 3.5; }
.tooltip {
  position: absolute;
  pointer-events: none;
  max-width: 320px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 8px 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  font-size: 13px;
  z-index: 2;
}
.tooltip strong { display: block; font-size: 15px; }
.tooltip .muted { color: var(--ink-2); }
.map-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  align-items: center;
  padding: 12px 16px;
  border-top: 1px solid var(--grid);
  color: var(--ink-2);
  font-size: 13px;
}
.key { display: inline-flex; align-items: center; gap: 8px; }
.key svg { display: block; }
.map-empty { padding: 48px 24px; color: var(--ink-2); }

/* The table: the map in rows, the source on the left, the target on the
   right and the bridge between them. */
.table-note { color: var(--ink-2); margin-bottom: 12px; max-width: 90ch; }
.table-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; }
.report { table-layout: fixed; }
.report col.side-col { width: 37%; }
.report col.sim-col { width: 13%; }
.report col.status-col { width: 13%; }
/* A collapsed border stays behind a sticky cell, so the header's rule is
   a shadow. */
.report > thead > tr > th { position: sticky; top: var(--toolbar-h, 0px); z-index: 1; background: var(--surface); padding: 10px 12px; border-bottom: 0; box-shadow: inset 0 -1px 0 var(--axis); }
.report > tbody > tr > td { padding: 10px 12px; }
.sort {
  border: 0;
  background: transparent;
  padding: 0;
  font: inherit;
  font-weight: 600;
  color: inherit;
  text-align: left;
  cursor: pointer;
  overflow-wrap: anywhere;
}
th[aria-sort="ascending"] .sort::after { content: " \2191"; }
th[aria-sort="descending"] .sort::after { content: " \2193"; }
.report tr.row { cursor: pointer; }
.report > tbody > tr.row:hover > td, .report > tbody > tr.row.open > td { background: var(--page); }
.report > tbody > tr.row.open > td, .report > tbody > tr.continued > td { border-bottom-color: transparent; }
.report .end { display: flex; gap: 10px; align-items: flex-start; }
.report .end svg { flex: none; }
.report .main { overflow-wrap: anywhere; }
.report td.none { color: var(--ink-3); }
.sub { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.sim-line { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.sim-line svg { flex: none; }
.report > tbody > tr.more-row > td { background: var(--page); padding: 4px 12px 20px 44px; }
.row-detail h3 { font-size: 14px; margin: 16px 0 4px; }
.pairs { margin-top: 4px; font-size: 13px; }
.pairs td { padding: 6px 8px; overflow-wrap: anywhere; }
.table-more { margin: 12px; }

/* The detail beside the map. */
.detail {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  padding: 16px 20px;
}
.detail ul, .row-detail ul { columns: 2 320px; column-gap: 40px; }
.detail li, .row-detail li { break-inside: avoid; }
.detail h3 { overflow-wrap: anywhere; }
.detail .where { color: var(--ink-2); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.detail .facts { margin: 12px 0; color: var(--ink-2); font-size: 14px; }
.detail ul, .row-detail ul { list-style: none; margin: 0; padding: 0; }
.detail li, .row-detail li { padding: 8px 0; border-top: 1px solid var(--grid); font-size: 14px; }
.detail li .code, .row-detail li .code { overflow-wrap: anywhere; }
.detail .status, .row-detail .status { display: block; color: var(--ink-2); font-size: 13px; }
.detail .hint { color: var(--ink-2); }
.badge {
  display: inline-block;
  font-size: 12px;
  line-height: 1.4;
  padding: 0 6px;
  border-radius: 6px;
  border: 1px solid var(--ink-2);
  color: var(--ink-1);
  margin-left: 6px;
  white-space: nowrap;
}

/* Sections under the map. */
.below { margin-top: 48px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 48px 40px; }
.section-head { margin-bottom: 12px; }
.section-head p { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.wide { grid-column: 1 / -1; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--axis); }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.code { overflow-wrap: anywhere; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--page); }
.more { margin-top: 8px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 40px; }
.meters h3 { font-size: 14px; color: var(--ink-2); font-weight: 600; margin-bottom: 8px; overflow-wrap: anywhere; }
.meter-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 64px; gap: 12px; align-items: center; padding: 5px 0; font-size: 14px; }
.meter-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--side); border-radius: 4px; }
.meter-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.chart svg { display: block; width: 100%; height: auto; }
.axis-text { fill: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.bar.l0 { fill: var(--lvl-0); } .bar.l1 { fill: var(--lvl-1); } .bar.l2 { fill: var(--lvl-2); }
.bar:hover { opacity: 0.8; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
details.table-view { margin-top: 12px; }
details.table-view summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--ink-3); font-size: 13px; }
.empty { color: var(--ink-2); }

@media (max-width: 1000px) {
  .below { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .frame { padding: 20px 14px 40px; }
  .toolbar { position: static; }
  .report colgroup, .pairs thead { display: none; }
  .report, .report tbody, .report tr, .report td { display: block; width: auto; }
  .report > thead { display: block; }
  .report > thead > tr { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 12px; box-shadow: inset 0 -1px 0 var(--axis); }
  .report > thead > tr > th { position: static; padding: 0; box-shadow: none; }
  .report > tbody > tr.row { border-bottom: 1px solid var(--grid); padding: 8px 0; }
  .report > tbody > tr > td { border: 0; padding: 2px 12px; }
  .report > tbody > tr.more-row > td { padding: 4px 12px 16px; }
  .pairs td { border: 0; padding: 2px 0; }
  .pairs tr { padding: 6px 0; border-bottom: 1px solid var(--grid); }
  .shores { grid-template-columns: 1fr 1fr; }
  .strait { grid-column: 1 / -1; text-align: left; order: 3; }
  .hero { font-size: 44px; }
  .meters { grid-template-columns: 1fr; }
  .search { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .bridge.arriving { animation: arrive 700ms ease-out backwards; }
  @keyframes arrive { from { opacity: 0; } }
}
</style>

<body>
<div class="viz-root">
<div class="frame">
  <header class="shores">
    <div class="shore source">
      <p class="shore-role"><span class="side-key side0"></span>Source</p>
      <h1 class="shore-name" id="source-name"></h1>
      <div class="figure-line">
        <span class="hero" id="source-share"></span>
        <span class="figure-note" id="source-note"></span>
      </div>
      <p class="tests-line" id="source-tests"></p>
    </div>
    <div class="strait" id="strait"></div>
    <div class="shore target">
      <p class="shore-role"><span class="side-key side1"></span>Target</p>
      <h1 class="shore-name" id="target-name"></h1>
      <div class="figure-line">
        <span class="figure-note" id="target-note"></span>
        <span class="figure" id="target-share"></span>
      </div>
      <p class="tests-line" id="target-tests"></p>
    </div>
  </header>

  <div class="toolbar-sentinel" id="toolbar-sentinel"></div>
  <div class="toolbar" id="toolbar">
  <div class="tabs" role="tablist" aria-label="How the page shows the comparison">
    <button type="button" role="tab" id="tab-map" data-view="map" aria-controls="map-view">Map</button>
    <button type="button" role="tab" id="tab-table" data-view="table" aria-controls="table-view">Table</button>
  </div>
  <nav class="filters" aria-label="What the page shows">
    <div class="control" id="kind-control">
      <span id="kind-label">Show</span>
      <div class="segmented" role="group" aria-labelledby="kind-label">
        <button type="button" data-kind="both" aria-pressed="false">Code and tests</button>
        <button type="button" data-kind="code" aria-pressed="true">Code</button>
        <button type="button" data-kind="tests" aria-pressed="false">Tests</button>
      </div>
    </div>
    <div class="control">
      <span id="lod-label">One mark per</span>
      <div class="segmented" role="group" aria-labelledby="lod-label">
        <button type="button" data-lod="folders" aria-pressed="false">Folder</button>
        <button type="button" data-lod="files" aria-pressed="false">File</button>
        <button type="button" data-lod="functions" aria-pressed="false">Function</button>
      </div>
    </div>
    <input class="search" id="search" type="search" placeholder="Find a file or function" aria-label="Find a file or function">
    <div class="zoom" id="zoom-control" role="group" aria-label="Zoom the map">
      <button type="button" class="plain-button" id="zoom-out" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button type="button" class="plain-button" id="fit">Fit the map</button>
      <button type="button" class="plain-button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
    </div>
  </nav>
  </div>

  <main>
    <div class="map-block" id="map-view" role="tabpanel" aria-labelledby="tab-map">
      <figure class="map-figure">
        <svg id="map" role="img"></svg>
        <div class="tooltip" id="tooltip" hidden></div>
        <figcaption class="map-foot" id="map-key"></figcaption>
      </figure>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </div>
    <div id="table-view" role="tabpanel" aria-labelledby="tab-table" hidden>
      <p class="table-note" id="table-note"></p>
      <div class="table-card">
        <div id="table-host"></div>
        <div class="map-foot" id="table-key"></div>
      </div>
    </div>

    <div class="below">
      <section id="ready-section">
        <div class="section-head">
          <h2>Ready to port</h2>
          <p id="ready-note"></p>
        </div>
        <div id="ready"></div>
      </section>

      <section id="similarity-section">
        <div class="section-head">
          <h2>How alike the pairs are</h2>
          <p>Pairs by cosine similarity, in steps of 0.05. The level is on the scale of the model that scored them.</p>
        </div>
        <div class="chart" id="similarity"></div>
      </section>

      <section class="wide" id="folders-section">
        <div class="section-head">
          <h2>Progress by folder</h2>
          <p id="folders-note">The share of each folder's functions that have a counterpart on the other side.</p>
        </div>
        <div class="meters" id="folders"></div>
      </section>

    </div>
  </main>

  <p class="foot" id="foot"></p>
</div>

<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const SVG = "http://www.w3.org/2000/svg";
  const LEVELS = ["low", "medium", "high"];

  if (!DATA) {
    $("map").replaceWith(Object.assign(document.createElement("p"), {
      className: "map-empty",
      textContent: "This page has no data. Run jscpd --compare with -r html to write it.",
    }));
    return;
  }

  // ---------------------------------------------------------------- data
  const files = DATA.files.map(([side, path], i) => {
    const cut = path.lastIndexOf("/") === -1 ? path.lastIndexOf("\\") : path.lastIndexOf("/");
    return { i, side, path, dir: cut === -1 ? "" : path.slice(0, cut), base: cut === -1 ? path : path.slice(cut + 1) };
  });
  // The page reads the first side as the source of a port: its functions
  // are the ones to port, so readiness shows there only. The JSON report
  // lists both sides.
  const fns = DATA.functions.map(([file, name, start, end, flags], i) => ({
    i, file, name, start, end,
    side: files[file].side,
    counted: (flags & 1) !== 0,
    test: (flags & 2) !== 0,
    ready: (flags & 4) !== 0 && files[file].side === 0,
    pairs: [],
