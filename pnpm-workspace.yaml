allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
  vue-demi: true

# content.config.ts imports @nuxt/content, which only docus depends on; the
# pattern links it at the root of node_modules so the import resolves under
# pnpm's strict layout without adding a second copy to the lockfile.
publicHoistPattern:
  - '@nuxt/content'

