name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so sitemap <lastmod> can use each page's last commit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      # Pinned: an unpinned `npm i pnpm -g` picked up a new major on 2026-09-06
      # and the deploy broke without any change to the repository.
      - name: Install pnpm
        run: npm i -g pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install

      # `pnpm exec` runs the nuxt from the lockfile. `pnpm dlx` installed a
      # fresh nuxt into a temp dir on every deploy; when its esbuild moved to a
      # version without build-script approval, pnpm refused
      # (ERR_PNPM_IGNORED_BUILDS) and the site stopped updating.
      - name: Build
        run: pnpm exec nuxt generate

      - name: List build output
        run: ls -la .output/public/ 2>/dev/null || (echo "No .output/public — showing .output:" && ls -la .output/ 2>/dev/null || echo "No .output either")

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .output/public --project-name=jscpd --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
