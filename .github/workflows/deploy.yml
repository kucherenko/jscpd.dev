name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install pnpm
        run: npm i pnpm -g

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm dlx nuxt generate

      - name: List build output
        run: ls -la .output/public/ 2>/dev/null || (echo "No .output/public — showing .output:" && ls -la .output/ 2>/dev/null || echo "No .output either")

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .output/public --project-name=jscpd --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
