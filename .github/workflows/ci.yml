name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pnpm
        run: npm i pnpm -g

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run jscpd copy/paste detector
        uses: kucherenko/jscpd-action@master
        with:
          path: "components plugins"
          format: "typescript,javascript,vue"
          ignore: "node_modules,dist,.nuxt,.output"
          min-lines: 3
          min-tokens: 30
          threshold: 5
          reporters: "console,json,html,sarif"
          output: "report"
