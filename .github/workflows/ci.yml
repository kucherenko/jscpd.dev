name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pnpm
        run: npm i pnpm -g

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run jscpd copy/paste detector
        run: |
          npx jscpd@5 \
            components plugins \
            --format typescript,javascript,vue \
            --ignore "node_modules,dist,.nuxt,.output" \
            --min-lines 3 \
            --min-tokens 30 \
            --reporters console,json,html,sarif \
            --output report

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('report/jscpd-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report/jscpd-report.sarif
        continue-on-error: true

      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: report
        continue-on-error: true
