name: Trending repos analysis

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Analyze trending repos with jscpd
        run: node scripts/analyze-trending.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed data
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "trending data unchanged — nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh trending repo analysis ($(date -u +%F))"
          git pull --rebase origin master
          git push origin master
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so kick the Pages deploy explicitly. Pass the commit itself: a
      # dispatch on `master` seconds after the push can still resolve to the
      # previous head, and the deploy then builds the day before. Wait for the
      # API to serve the new head first so `--ref master` accepts the input.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for i in $(seq 1 30); do
            head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha 2>/dev/null || true)
            [ "$head" = "$SHA" ] && break
            echo "master is at ${head:-?}, waiting for ${SHA} ($i/30)"
            sleep 5
          done
          gh workflow run deploy.yml --ref master -f "sha=${SHA}"
          echo "deploy dispatched for ${SHA}"
