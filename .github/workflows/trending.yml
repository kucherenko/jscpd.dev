name: Trending repos analysis

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Analyze trending repos with jscpd
        run: node scripts/analyze-trending.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed data
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "trending data unchanged — nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh trending repo analysis ($(date -u +%F))"
          git pull --rebase origin master
          git push origin master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so kick the Pages deploy explicitly
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
