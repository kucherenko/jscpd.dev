name: Test install.ps1

# Validates the Windows installer end-to-end on a real Windows runner:
# fresh install, idempotent re-run, -Force replace, and -DryRun.
# Runs on PRs that touch the script, and on demand.

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-install]
  pull_request:
    paths:
      - "public/install.ps1"
      - ".github/workflows/test-install-ps1.yml"

permissions:
  contents: read

jobs:
  install:
    name: install.ps1 on ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh] # Windows PowerShell 5.1 and PowerShell 7
    steps:
      - uses: actions/checkout@v4

      - name: Fresh install
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./public/install.ps1 -Prefix "$env:RUNNER_TEMP\jscpd-bin"
          $exe = "$env:RUNNER_TEMP\jscpd-bin\jscpd.exe"
          if (-not (Test-Path $exe)) { throw "jscpd.exe was not installed to the requested prefix" }
          if (-not (Test-Path "$env:RUNNER_TEMP\jscpd-bin\cpd.exe")) { throw "cpd.exe alias missing" }
          $v = & $exe --version
          Write-Host "installed version output: $v"
          if (-not $v) { throw "binary did not run" }

      - name: Detects an existing install (no -Force)
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & ./public/install.ps1 -Prefix "$env:RUNNER_TEMP\jscpd-bin" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'already installed') { throw "expected an 'already installed' short-circuit" }

      - name: Reinstall with -Force
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./public/install.ps1 -Prefix "$env:RUNNER_TEMP\jscpd-bin" -Force
          & "$env:RUNNER_TEMP\jscpd-bin\jscpd.exe" --version

      - name: Pinned version
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./public/install.ps1 -Prefix "$env:RUNNER_TEMP\jscpd-pinned" -Version 5.1.0
          $v = & "$env:RUNNER_TEMP\jscpd-pinned\jscpd.exe" --version
          Write-Host "pinned version output: $v"
          if ("$v" -notmatch '5\.1\.0') { throw "expected 5.1.0, got: $v" }

      - name: Dry run does not write
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./public/install.ps1 -Prefix "$env:RUNNER_TEMP\jscpd-dry" -DryRun
          if (Test-Path "$env:RUNNER_TEMP\jscpd-dry\jscpd.exe") { throw "-DryRun wrote a binary" }

      - name: Real duplicate detection
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\src" -Force | Out-Null
          $body = @()
          $body += 'function dup() {'
          0..19 | ForEach-Object { $body += "  console.log($_);" }
          $body += '  return 1;'
          $body += '}'
          $body -join "`n" | Set-Content "$env:RUNNER_TEMP\src\a.js"
          $body -join "`n" | Set-Content "$env:RUNNER_TEMP\src\b.js"
          $out = & "$env:RUNNER_TEMP\jscpd-bin\jscpd.exe" --min-tokens 20 --reporters console "$env:RUNNER_TEMP\src" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'clone') { throw "expected a clone to be reported" }
